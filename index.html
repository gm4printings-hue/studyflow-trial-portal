<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Powered by Distingstyle Ltd</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Anti-Copy and Content Protection Baseline */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen" oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        function StudyFlow() {
            const [lang, setLang] = React.useState('en');
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [selectedCategory, setSelectedCategory] = React.useState('math');
            const [notes, setNotes] = React.useState('');
            const [summary, setSummary] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [isSpeaking, setIsSpeaking] = React.useState(false);

            // Categories list (STEM focused with heavy media tier, non-STEM text/image tier)
            const categories = [
                { id: 'math', nameEn: 'Mathematics', nameFr: 'Mathématiques', nameAr: 'الرياضيات', icon: '📐', stem: true },
                { id: 'physics', nameEn: 'Physics', nameFr: 'Physique', nameAr: 'الفيزياء', icon: '⚡', stem: true },
                { id: 'chem', nameEn: 'Chemistry', nameFr: 'Chimie', nameAr: 'الكيمياء', icon: '🧪', stem: true },
                { id: 'bio', nameEn: 'Biology', nameFr: 'Biologie', nameAr: 'الأحياء', icon: '🧬', stem: true },
                { id: 'history', nameEn: 'History & Geo', nameFr: 'Histoire & Géo', nameAr: 'التاريخ والجغرافيا', icon: '🌍', stem: false },
                { id: 'langs', nameEn: 'Languages', nameFr: 'Langues', nameAr: 'اللغات', icon: '📖', stem: false }
            ];

            const handleSaveKey = (e) => {
                e.preventDefault();
                localStorage.setItem('gemini_api_key', apiKey);
                alert(lang === 'ar' ? 'تم حفظ مفتاح API بنجاح!' : lang === 'fr' ? 'Clé API enregistrée !' : 'API Key Saved Successfully!');
            };

            const handleGeminiCall = async () => {
                if (!apiKey) {
                    alert(lang === 'ar' ? 'الرجاء إدخال مفتاح Gemini API أولاً.' : lang === 'fr' ? 'Veuillez d\'abord entrer votre clé API Gemini.' : 'Please enter your Gemini API Key first.');
                    return;
                }
                if (!notes.trim()) {
                    alert(lang === 'ar' ? 'الرجاء إدخال نص الدرس أو الملاحظات.' : lang === 'fr' ? 'Veuillez entrer du texte.' : 'Please enter study text.');
                    return;
                }

                setLoading(true);
                setSummary('');
                try {
                    const currentCat = categories.find(c => c.id === selectedCategory);
                    const promptText = `You are an expert tutor for the subject: ${currentCat ? currentCat.nameEn : 'General'}. Provide a clear, highly structured explanation and key takeaway points in language '${lang}'. Study Material:\n\n${notes}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                        setSummary(data.candidates[0].content.parts[0].text);
                    } else if (data.error) {
                        setSummary(`API Error: ${data.error.message}`);
                    } else {
                        setSummary('No response generated. Please check your API key.');
                    }
                } catch (err) {
                    console.error(err);
                    setSummary('Connection error. Please check your network or API key.');
                }
                setLoading(false);
            };

            // Built-in Browser Voice Reader (Text-to-Speech)
            const handleSpeak = () => {
                if (!summary) return;
                if ('speechSynthesis' in window) {
                    if (isSpeaking) {
                        window.speechSynthesis.cancel();
                        setIsSpeaking(false);
                        return;
                    }
                    const utterance = new SpeechSynthesisUtterance(summary);
                    utterance.lang = lang === 'ar' ? 'ar-SA' : lang === 'fr' ? 'fr-FR' : 'en-US';
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    setIsSpeaking(true);
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert('Audio playback is not supported on this browser.');
                }
            };

            return (
                <div className="max-w-5xl mx-auto p-6" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    {/* Header with Distingstyle Branding */}
                    <header className="flex flex-col md:flex-row justify-between items-center py-4 border-b border-slate-800 mb-6 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                                StudyFlow AI
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Powered by Distingstyle Ltd</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'en' ? 'bg-blue-600' : 'bg-slate-800'}`}>EN</button>
                            <button onClick={() => setLang('fr')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'fr' ? 'bg-blue-600' : 'bg-slate-800'}`}>FR</button>
                            <button onClick={() => setLang('ar')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'ar' ? 'bg-blue-600' : 'bg-slate-800'}`}>AR</button>
                        </div>
                    </header>

                    {/* API Key Settings */}
                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-6 shadow-lg">
                        <h2 className="text-sm font-semibold mb-2 text-slate-400">
                            {lang === 'ar' ? 'إعدادات مفتاح Gemini API' : lang === 'fr' ? 'Configuration de la clé API Gemini' : 'Gemini API Key Configuration'}
                        </h2>
                        <form onSubmit={handleSaveKey} className="flex gap-2">
                            <input 
                                type="password" 
                                placeholder={lang === 'ar' ? 'أدخل مفتاح الـ API هنا...' : lang === 'fr' ? 'Entrez votre clé API ici...' : 'Paste your Gemini API Key here...'} 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)}
                                className="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                            />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm font-medium transition-colors">
                                {lang === 'ar' ? 'حفظ المفتاح' : lang === 'fr' ? 'Enregistrer' : 'Save Key'}
                            </button>
                        </form>
                    </div>

                    {/* Study Categories Grid */}
                    <div className="mb-8">
                        <h2 className="text-lg font-bold mb-4 text-slate-200">
                            {lang === 'ar' ? 'تصنيفات المواد الدراسية' : lang === 'fr' ? 'Catégories d\'études' : 'Study Categories'}
                        </h2>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {categories.map((cat) => (
                                <div 
                                    key={cat.id} 
                                    onClick={() => setSelectedCategory(cat.id)}
                                    className={`p-4 rounded-xl border cursor-pointer transition-all bg-slate-900 hover:border-blue-500 ${selectedCategory === cat.id ? 'border-blue-500 bg-slate-800 ring-2 ring-blue-500/30' : 'border-slate-800'}`}
                                >
                                    <div className="text-3xl mb-2">{cat.icon}</div>
                                    <h3 className="font-semibold text-sm">
                                        {lang === 'ar' ? cat.nameAr : lang === 'fr' ? cat.nameFr : cat.nameEn}
                                    </h3>
                                    <p className="text-xs text-slate-500 mt-1">
                                        {cat.stem 
                                            ? (lang === 'ar' ? 'وسائط غنية + شرح معمق' : lang === 'fr' ? 'Médias riches + Explication' : 'Rich Media + Deep Explanations') 
                                            : (lang === 'ar' ? 'صور + ملخصات نصية' : lang === 'fr' ? 'Images + Textes' : 'Images + Text Summaries')
                                        }
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* AI Lesson Explainer Card */}
                    <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg mb-8">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold">
                                {lang === 'ar' ? 'مساعد شرح وتلخيص الدروس' : lang === 'fr' ? 'Assistant de cours IA' : 'AI Lesson Explainer'}
                            </h2>
                            <span className="text-xs px-2.5 py-1 rounded bg-blue-950 text-blue-400 border border-blue-800 font-mono uppercase">
                                {selectedCategory}
                            </span>
                        </div>
                        <textarea 
                            rows="5"
                            placeholder={lang === 'ar' ? 'ضع نص الدرس أو الأسئلة هنا...' : lang === 'fr' ? 'Collez votre leçon ici...' : 'Paste your lesson material or study notes here...'}
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-slate-200 mb-4 focus:outline-none focus:border-blue-500 text-sm"
                        ></textarea>
                        
                        <div className="flex flex-wrap gap-3">
                            <button 
                                onClick={handleGeminiCall}
                                disabled={loading}
                                className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50 text-sm"
                            >
                                {loading ? (lang === 'ar' ? 'جاري المعالجة...' : lang === 'fr' ? 'Traitement...' : 'Processing...') : (lang === 'ar' ? 'اشرح الدرس بواسطة Gemini' : lang === 'fr' ? 'Expliquer la leçon' : 'Explain Lesson with Gemini')}
                            </button>
                        </div>

                        {summary && (
                            <div className="mt-6 p-4 bg-slate-950 border border-slate-800 rounded-lg relative">
                                <div className="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                                    <h3 className="font-semibold text-blue-400 text-sm">
                                        {lang === 'ar' ? 'نتيجة الشرح والتلخيص:' : lang === 'fr' ? 'Résultat :' : 'Explanation Result:'}
                                    </h3>
                                    <button 
                                        onClick={handleSpeak}
                                        className="bg-indigo-900/60 hover:bg-indigo-800 border border-indigo-700/50 text-indigo-200 px-3 py-1 rounded text-xs flex items-center gap-1 transition-colors"
                                    >
                                        {isSpeaking ? '⏹️ Stop' : '🔊 Listen (Voice)'}
                                    </button>
                                </div>
                                <p className="whitespace-pre-wrap text-slate-300 text-sm leading-relaxed">{summary}</p>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="text-center text-xs text-slate-600 pt-4 border-t border-slate-900">
                        StudyFlow Platform © 2026. A Product by Distingstyle Ltd. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<StudyFlow />, document.getElementById('root'));
    </script>
</body>
</html>
