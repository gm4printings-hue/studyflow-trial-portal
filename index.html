<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - AI Study Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function StudyFlow() {
            const [lang, setLang] = React.useState('en');
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [notes, setNotes] = React.useState('');
            const [summary, setSummary] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            // Save Gemini API Key to Local Storage
            const handleSaveKey = (e) => {
                e.preventDefault();
                localStorage.setItem('gemini_api_key', apiKey);
                alert(lang === 'ar' ? 'تم حفظ مفتاح API بنجاح!' : lang === 'fr' ? 'Clé API enregistrée !' : 'API Key Saved Successfully!');
            };

            // Call Gemini API directly from client side
            const handleGeminiCall = async () => {
                if (!apiKey) {
                    alert(lang === 'ar' ? 'الرجاء إدخال مفتاح Gemini API أولاً.' : lang === 'fr' ? 'Veuillez d\'abord entrer votre clé API Gemini.' : 'Please enter your Gemini API Key first.');
                    return;
                }
                if (!notes.trim()) {
                    alert(lang === 'ar' ? 'الرجاء إدخال بعض الملاحظات للدراسة.' : lang === 'fr' ? 'Veuillez entrer des notes à résumer.' : 'Please enter notes to summarize.');
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ 
                                parts: [{ 
                                    text: `Summarize these study notes concisely in key bullet points in language '${lang}': \n\n${notes}` 
                                }] 
                            }]
                        })
                    });
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                    setSummary(text);
                } catch (err) {
                    console.error(err);
                    alert('Error connecting to Gemini API');
                }
                setLoading(false);
            };

            return (
                <div className="max-w-4xl mx-auto p-6" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    {/* Header */}
                    <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
                        <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                            StudyFlow AI
                        </h1>
                        <div className="flex gap-2">
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'en' ? 'bg-blue-600' : 'bg-slate-800'}`}>EN</button>
                            <button onClick={() => setLang('fr')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'fr' ? 'bg-blue-600' : 'bg-slate-800'}`}>FR</button>
                            <button onClick={() => setLang('ar')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'ar' ? 'bg-blue-600' : 'bg-slate-800'}`}>AR</button>
                        </div>
                    </header>

                    {/* API Key Configuration Card */}
                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-6 shadow-lg">
                        <h2 className="text-sm font-semibold mb-2 text-slate-400">
                            {lang === 'ar' ? 'إعدادات مفتاح Gemini API' : lang === 'fr' ? 'Configuration de la clé API Gemini' : 'Gemini API Key Configuration'}
                        </h2>
                        <form onSubmit={handleSaveKey} className="flex gap-2">
                            <input 
                                type="password" 
                                placeholder={lang === 'ar' ? 'أدخل مفتاح الـ API هنا...' : lang === 'fr' ? 'Entrez votre clé API ici...' : 'Paste your Gemini API Key here...'} 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)}
                                className="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                            />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm font-medium transition-colors">
                                {lang === 'ar' ? 'حفظ' : lang === 'fr' ? 'Enregistrer' : 'Save'}
                            </button>
                        </form>
                    </div>

                    {/* AI Summarizer Card */}
                    <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
                        <h2 className="text-lg font-bold mb-4">
                            {lang === 'ar' ? 'ملخص الملاحظات بالذكاء الاصطناعي' : lang === 'fr' ? 'Résumé de notes par IA' : 'AI Notes Summarizer'}
                        </h2>
                        <textarea 
                            rows="5"
                            placeholder={lang === 'ar' ? 'الصق مواد الدراسة أو ملاحظات المحاضرة هنا...' : lang === 'fr' ? 'Collez vos notes de cours ici...' : 'Paste your study material or lecture notes here...'}
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-slate-200 mb-4 focus:outline-none focus:border-blue-500 text-sm"
                        ></textarea>
                        <button 
                            onClick={handleGeminiCall}
                            disabled={loading}
                            className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50 text-sm"
                        >
                            {loading ? (lang === 'ar' ? 'جاري المعالجة...' : lang === 'fr' ? 'Traitement en cours...' : 'Processing...') : (lang === 'ar' ? 'تلخيص بواسطة Gemini AI' : lang === 'fr' ? 'Résumer avec Gemini AI' : 'Summarize with Gemini AI')}
                        </button>

                        {summary && (
                            <div className="mt-6 p-4 bg-slate-950 border border-slate-800 rounded-lg">
                                <h3 className="font-semibold text-blue-400 mb-2 text-sm">
                                    {lang === 'ar' ? 'نتيجة الملخص:' : lang === 'fr' ? 'Résultat du résumé :' : 'Summary Result:'}
                                </h3>
                                <p className="whitespace-pre-wrap text-slate-300 text-sm leading-relaxed">{summary}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<StudyFlow />, document.getElementById('root'));
    </script>
</body>
</html>
