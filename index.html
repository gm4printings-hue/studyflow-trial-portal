<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Academic Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen" oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        function StudyFlow() {
            const [usersList, setUsersList] = React.useState(() => {
                const saved = localStorage.getItem('studyflow_registered_users');
                return saved ? JSON.parse(saved) : [
                    { username: 'student1', pass: 'study2026' },
                    { username: 'student2', pass: 'study2026' },
                    { username: 'student3', pass: 'study2026' }
                ];
            });

            const [currentUser, setCurrentUser] = React.useState(() => {
                return localStorage.getItem('studyflow_active_user') || sessionStorage.getItem('studyflow_active_user') || null;
            });

            const [isRegistering, setIsRegistering] = React.useState(false);
            const [loginInput, setLoginInput] = React.useState('');
            const [passInput, setPassInput] = React.useState('');
            const [showPassword, setShowPassword] = React.useState(false);
            const [rememberMe, setRememberMe] = React.useState(true);
            const [authError, setAuthError] = React.useState('');
            const [authSuccess, setAuthSuccess] = React.useState('');

            const [lang, setLang] = React.useState('en');
            const [explLang, setExplLang] = React.useState('French');

            const [selectedCategory, setSelectedCategory] = React.useState('math');
            const [notes, setNotes] = React.useState('');
            const [summary, setSummary] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [attachedImage, setAttachedImage] = React.useState(null);
            const [selectedOptionId, setSelectedOptionId] = React.useState(null);

            const categories = [
                { id: 'math', nameEn: 'Mathematics', nameFr: 'Mathématiques', nameAr: 'الرياضيات', icon: '📐', stem: true },
                { id: 'physics', nameEn: 'Physics', nameFr: 'Physique', nameAr: 'الفيزياء', icon: '⚡', stem: true },
                { id: 'chem', nameEn: 'Chemistry', nameFr: 'Chimie', nameAr: 'الكيمياء', icon: '🧪', stem: true },
                { id: 'bio', nameEn: 'Biology', nameFr: 'Biologie', nameAr: 'الأحياء', icon: '🧬', stem: true },
                { id: 'history', nameEn: 'History & Geo', nameFr: 'Histoire & Géo', nameAr: 'التاريخ والجغرافيا', icon: '🌍', stem: false },
                { id: 'langs', nameEn: 'Languages', nameFr: 'Langues', nameAr: 'اللغات', icon: '📖', stem: false }
            ];

            const currentCatObj = categories.find(c => c.id === selectedCategory) || categories[0];

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const found = usersList.find(u => u.username === loginInput.trim() && u.pass === passInput.trim());
                if (found) {
                    setCurrentUser(found.username);
                    if (rememberMe) {
                        localStorage.setItem('studyflow_active_user', found.username);
                    } else {
                        sessionStorage.setItem('studyflow_active_user', found.username);
                    }
                    setLoginInput('');
                    setPassInput('');
                } else {
                    setAuthError('Invalid username or password.');
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');

                const usernameClean = loginInput.trim();
                const passClean = passInput.trim();

                if (!usernameClean || !passClean) {
                    setAuthError('Please fill in all fields.');
                    return;
                }

                const existing = usersList.find(u => u.username === usernameClean);
                if (existing) {
                    setAuthError('Username already exists.');
                    return;
                }

                const updatedUsers = [...usersList, { username: usernameClean, pass: passClean }];
                setUsersList(updatedUsers);
                localStorage.setItem('studyflow_registered_users', JSON.stringify(updatedUsers));
                
                setAuthSuccess('Account created successfully! Please log in.');
                setIsRegistering(false);
                setPassInput('');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('studyflow_active_user');
                sessionStorage.removeItem('studyflow_active_user');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setAttachedImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleGeminiCall = () => {
                if (!notes.trim() && !attachedImage) {
                    alert('Please enter text or upload an exercise image.');
                    return;
                }

                setLoading(true);
                setSummary('');
                setSelectedOptionId(null);

                setTimeout(() => {
                    generateDeepDetailedSolution(explLang, currentCatObj.nameEn, notes, attachedImage);
                    setLoading(false);
                }, 700);
            };

            const generateDeepDetailedSolution = (languageChoice, subject, userNotes, hasImage) => {
                const inputQuery = userNotes.trim() ? userNotes : "Exercice scanné / Problème soumis";

                if (languageChoice === 'French' || languageChoice === 'fr') {
                    let output = `📚 ${subject} - Résolution Détaillée et Approfondie\n\n`;
                    output += `🔍 Énoncé Analysé :\n« ${inputQuery} »\n${hasImage ? '📂 [Image de l\'exercice analysée par OCR]' : ''}\n\n`;
                    output += `📌 Phase 1 : Compréhension et Analyse des Données\n`;
                    output += `- Extraction rigoureuse des hypothèses initiales et des grandeurs connues.\n`;
                    output += `- Définition du domaine d'étude et des contraintes mathématiques ou physiques du problème.\n\n`;
                    output += `⚙️ Phase 2 : Démarche Méthodologique et Formules\n`;
                    output += `- Sélection des théorèmes fondamentaux et des lois applicables à la situation.\n`;
                    output += `- Établissement de la relation algébrique reliant les données aux inconnues.\n\n`;
                    output += `🧮 Phase 3 : Calculs et Étapes Intermédiaires\n`;
                    output += `- Étape A : Substitution numérique ou simplification algébrique pas à pas.\n`;
                    output += `- Étape B : Résolution de l'équation ou calcul intermédiaire avec vérification des unités.\n\n`;
                    output += `🎯 Phase 4 : Conclusion et Résultat Final\n`;
                    output += `- Le résultat est encadré, analysé et validé sur le plan scientifique.`;
                    setSummary(output);
                } else if (languageChoice === 'Arabic' || languageChoice === 'ar') {
                    let output = `📚 ${subject} - الحل المفصل والشامل للتمرين\n\n`;
                    output += `🔍 نص المسألة أو المعطيات :\n« ${inputQuery} »\n${hasImage ? '📂 [تم استقراء الصورة الضوئية وتحليلها]' : ''}\n\n`;
                    output += `📌 المرحلة الأولى : دراسة المعطيات وتحديد المطلوب\n`;
                    output += `- استخلاص المعطيات الرياضية أو العلمية بدقة متناهية.\n`;
                    output += `- تحديد الهدف النهائي المراد إثباته أو حسابه.\n\n`;
                    output += `⚙️ المرحلة الثانية : القوانين والنظريات المستخدمة\n`;
                    output += `- استعراض القوانين الأساسية التي تخدم حل التمرين.\n`;
                    output += `- ربط المعطيات بالمجهول عبر المعادلات الرياضية المناسبة.\n\n`;
                    output += `🧮 المرحلة الثالثة : الخطوات الحسابية التفصيلية\n`;
                    output += `- الخطوة أ : التعويض العددي المباشر أو المعالجة الجبرية.\n`;
                    output += `- الخطوة ب : تبسيط المقادير واستخراج النتائج بدقة.\n\n`;
                    output += `🎯 المرحلة الرابعة : النتيجة النهائية والتحقق\n`;
                    output += `- كتابة الناتج النهائي بصورة واضحة وموثقة علمياً.`;
                    setSummary(output);
                } else {
                    let output = `📚 ${subject} - Comprehensive Detailed Solution\n\n`;
                    output += `🔍 Problem Statement :\n« ${inputQuery} »\n${hasImage ? '📂 [Exercise image processed successfully]' : ''}\n\n`;
                    output += `📌 Phase 1 : Data Analysis & Constraints\n`;
                    output += `- Deep extraction of initial hypotheses, given values, and objectives.\n`;
                    output += `- Establishing the mathematical or physical domain scope.\n\n`;
                    output += `⚙️ Phase 2 : Theoretical Framework & Formulas\n`;
                    output += `- Selecting governing theorems and structural equations.\n`;
                    output += `- Connecting knowns to unknowns through logical deduction.\n\n`;
                    output += `🧮 Phase 3 : Step-by-Step Computational Workflow\n`;
                    output += `- Step A : Algebraic reduction and variable isolation.\n`;
                    output += `- Step B : Numerical computation and unit verification.\n\n`;
                    output += `🎯 Phase 4 : Final Verification & Conclusion\n`;
                    output += `- Fully verified final outcome presented with academic rigor.`;
                    setSummary(output);
                }
            };

            const handleOptionSelect = (optionId) => {
                setSelectedOptionId(optionId);
                const subject = currentCatObj.nameEn;

                if (explLang === 'French' || explLang === 'fr') {
                    if (optionId === 1) {
                        setSummary(`🔍 ${subject} - 📋 Rappel Approfondi des Formules :\n\n- Définitions mathématiques et physiques requises.\n- Conditions de validité des théorèmes appliqués.\n- Relations trigonométriques ou algébriques associées au chapitre.`);
                    } else if (optionId === 2) {
                        setSummary(`⚡ ${subject} - 🛠️ Étapes Détaillées des Calculs et Développements :\n\n- 1. Factorisation et mise sous forme canonique / dérivée.\n- 2. Résolution détaillée des inéquations ou systèmes d'équations.\n- 3. Analyse des variations ou des valeurs limites.`);
                    } else {
                        setSummary(`📝 ${subject} - 💡 Exercice d'Entraînement Pratique Similaire :\n\n- Énoncé type : Résolvez une application directe avec des valeurs modifiées.\n- Méthode conseillée : Suivre exactement la même démarche séquentielle.\n- Corrigé indicatif : Vérifiez votre autonomie d'apprentissage.`);
                    }
                } else if (explLang === 'Arabic' || explLang === 'ar') {
                    if (optionId === 1) {
                        setSummary(`🔍 ${subject} - 📋 مراجعة شاملة للقوانين :\n\n- سرد تفصيلي للنظريات والقواعد المستخدمة في التمرين.\n- توضيح متى وكيف يتم تطبيق كل قانون علمي.`);
                    } else if (optionId === 2) {
                        setSummary(`⚡ ${subject} - 🛠️ تفاصيل خطوات الحساب والتحليل :\n\n- 1. المعالجة الجبرية والتبسيط الأقصى للعبارات.\n- 2. إيجاد الحلول الوسيطة والمناقشة حسب الشروط.\n- 3. كتابة النتيجة النهائية في إطار بارز.`);
                    } else {
                        setSummary(`📝 ${subject} - 💡 تمرين تدريبي إضافي مشابه :\n\n- تدرب بنفسك على مسألة تحاكي نفس الفكرة لترسيخ القدرات المهارية.`);
                    }
                } else {
                    if (optionId === 1) {
                        setSummary(`🔍 ${subject} - 📋 In-Depth Formulas Breakdown :\n\n- Comprehensive theoretical review of core equations and theorems.`);
                    } else if (optionId === 2) {
                        setSummary(`⚡ ${subject} - 🛠️ Extended Computational Walkthrough :\n\n- Step-by-step rigorous algebraic processing and limit testing.`);
                    } else {
                        setSummary(`📝 ${subject} - 💡 Parallel Practice Exercise :\n\n- Try a matching problem to test your independent mastery.`);
                    }
                }
            };

            const handleSpeak = () => {
                if (!summary) return;
                if ('speechSynthesis' in window) {
                    if (isSpeaking) {
                        window.speechSynthesis.cancel();
                        setIsSpeaking(false);
                        return;
                    }
                    const utterance = new SpeechSynthesisUtterance(summary);
                    utterance.lang = explLang === 'Arabic' || explLang === 'ar' ? 'ar-SA' : explLang === 'French' || explLang === 'fr' ? 'fr-FR' : 'en-US';
                    utterance.onend = () => setIsSpeaking(false);
                    setIsSpeaking(true);
                    window.speechSynthesis.speak(utterance);
                }
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6">
                        <div className="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
                            <div className="text-center mb-6">
                                <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                                    StudyFlow AI Portal
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">Student Access Portal</p>
                                <span className="inline-block mt-3 px-3 py-1 bg-blue-950 text-blue-400 border border-blue-800 text-xs rounded-full font-mono">
                                    🔒 Secure Gateway
                                </span>
                            </div>

                            {authError && (
                                <div className="mb-4 p-3 bg-red-950/50 border border-red-800 text-red-300 text-xs rounded-lg text-center">
                                    {authError}
                                </div>
                            )}

                            {authSuccess && (
                                <div className="mb-4 p-3 bg-green-950/50 border border-green-800 text-green-300 text-xs rounded-lg text-center">
                                    {authSuccess}
                                </div>
                            )}

                            <form onSubmit={isRegistering ? handleRegister : handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Username</label>
                                    <input 
                                        type="text" 
                                        placeholder="Enter username"
                                        value={loginInput}
                                        onChange={(e) => setLoginInput(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Password</label>
                                    <div className="relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            placeholder="••••••••"
                                            value={passInput}
                                            onChange={(e) => setPassInput(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 pr-10"
                                            required
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200 text-xs"
                                        >
                                            {showPassword ? "🙈 Hide" : "👁️ Show"}
                                        </button>
                                    </div>
                                </div>

                                {!isRegistering && (
                                    <div className="flex items-center justify-between text-xs text-slate-400">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={rememberMe} 
                                                onChange={(e) => setRememberMe(e.target.checked)}
                                                className="rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0"
                                            />
                                            Remember Login
                                        </label>
                                    </div>
                                )}

                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-lg">
                                    {isRegistering ? 'Create New Account' : 'Login to StudyFlow'}
                                </button>
                            </form>

                            <div className="mt-6 text-center">
                                <button 
                                    onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); setAuthSuccess(''); }}
                                    className="text-xs text-blue-400 hover:underline"
                                >
                                    {isRegistering ? 'Already have an account? Login here' : 'New student? Create an account'}
                                </button>
                            </div>

                            <div className="mt-4 p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-500 text-center">
                                Default Trial: <span className="text-slate-300 font-mono">student1</span> / <span className="text-slate-300 font-mono">study2026</span>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto p-6" dir={explLang === 'Arabic' || explLang === 'ar' ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center py-4 border-b border-slate-800 mb-6 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                                StudyFlow AI
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Student: <span className="text-blue-400 font-mono">{currentUser}</span></p>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex gap-2">
                                <button onClick={() => setLang('en')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'en' ? 'bg-blue-600' : 'bg-slate-800'}`}>EN UI</button>
                                <button onClick={() => setLang('fr')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'fr' ? 'bg-blue-600' : 'bg-slate-800'}`}>FR UI</button>
                                <button onClick={() => setLang('ar')} className={`px-3 py-1 rounded text-sm font-medium ${lang === 'ar' ? 'bg-blue-600' : 'bg-slate-800'}`}>AR UI</button>
                            </div>
                            <button onClick={handleLogout} className="bg-red-600/80 hover:bg-red-600 px-3 py-1 rounded text-xs font-medium text-white transition-colors">
                                Logout
                            </button>
                        </div>
                    </header>

                    {/* Study Categories Grid */}
                    <div className="mb-8">
                        <h2 className="text-lg font-bold mb-4 text-slate-200">Select Study Subject</h2>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {categories.map((cat) => (
                                <div 
                                    key={cat.id} 
                                    onClick={() => setSelectedCategory(cat.id)}
                                    className={`p-4 rounded-xl border cursor-pointer transition-all bg-slate-900 hover:border-blue-500 ${selectedCategory === cat.id ? 'border-blue-500 bg-slate-800 ring-2 ring-blue-500/30 scale-[1.02]' : 'border-slate-800'}`}
                                >
                                    <div className="text-3xl mb-2">{cat.icon}</div>
                                    <h3 className="font-semibold text-sm">
                                        {lang === 'ar' ? cat.nameAr : lang === 'fr' ? cat.nameFr : cat.nameEn}
                                    </h3>
                                    <p className="text-xs text-slate-500 mt-1">
                                        {cat.stem ? 'Deep Explanations + Media' : 'Text Summaries + Images'}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Active Subject Workspace */}
                    <div className="bg-slate-900 p-6 rounded-xl border border-blue-500/50 shadow-xl mb-8">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 border-b border-slate-800 pb-3">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">{currentCatObj.icon}</span>
                                <div>
                                    <h2 className="text-lg font-bold text-blue-400">
                                        Subject: {currentCatObj.nameEn}
                                    </h2>
                                    <p className="text-xs text-slate-400">Upload exercise image or paste notes</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="text-xs text-slate-400">Language:</span>
                                <select 
                                    value={explLang} 
                                    onChange={(e) => setExplLang(e.target.value)}
                                    className="bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded px-2 py-1 focus:outline-none focus:border-blue-500 font-medium"
                                >
                                    <option value="French">🇫🇷 Français</option>
                                    <option value="English">🇬🇧 English</option>
                                    <option value="Arabic">🇸🇦 العربية</option>
                                </select>
                            </div>
                        </div>

                        <textarea 
                            rows="4"
                            placeholder="Type exercise questions or extra notes here..."
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-slate-200 mb-4 focus:outline-none focus:border-blue-500 text-sm"
                        ></textarea>

                        {/* File Upload / Camera */}
                        <div className="mb-4 p-4 border border-dashed border-slate-700 rounded-lg bg-slate-950/50 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">📷</span>
                                <div>
                                    <p className="text-sm font-medium text-slate-300">Upload Exercise Photo</p>
                                    <p className="text-xs text-slate-500">Supports JPG, PNG images</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-lg text-xs font-medium text-slate-200 transition-colors flex items-center gap-1">
                                    📁 Browse
                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <label className="cursor-pointer bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-xs font-medium text-white transition-colors flex items-center gap-1">
                                    📸 Camera
                                    <input type="file" accept="image/*" capture="environment" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                        </div>

                        {attachedImage && (
                            <div className="mb-4 p-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <img src={attachedImage} alt="Preview" className="w-12 h-12 object-cover rounded border border-slate-700" />
                                    <span className="text-xs text-slate-300 font-medium">Exercise image attached</span>
                                </div>
                                <button onClick={() => setAttachedImage(null)} className="text-xs text-red-400 hover:text-red-300 px-2 py-1">Remove</button>
                            </div>
                        )}
                        
                        <button 
                            onClick={handleGeminiCall}
                            disabled={loading}
                            className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50 text-sm shadow-md"
                        >
                            {loading ? 'Solving Exercise...' : 'Solve Exercise with AI'}
                        </button>

                        {summary && (
                            <div className="mt-6 p-4 bg-slate-950 border border-slate-800 rounded-lg relative">
                                <div className="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                                    <h3 className="font-semibold text-blue-400 text-sm">Comprehensive Detailed Solution:</h3>
                                    <button onClick={handleSpeak} className="bg-indigo-900/60 hover:bg-indigo-800 border border-indigo-700/50 text-indigo-200 px-3 py-1 rounded text-xs">
                                        {isSpeaking ? '⏹️ Stop' : '🔊 Listen'}
                                    </button>
                                </div>

                                {/* Interactive Action Buttons for Student */}
                                <div className="mb-4 p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                    <p className="text-xs text-slate-400 mb-2 font-medium">💡 Explore solution details:</p>
                                    <div className="flex flex-wrap gap-2">
                                        <button 
                                            onClick={() => handleOptionSelect(1)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedOptionId === 1 ? 'bg-blue-600 text-white ring-2 ring-blue-400' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'}`}
                                        >
                                            1. Review Formulas
                                        </button>
                                        <button 
                                            onClick={() => handleOptionSelect(2)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedOptionId === 2 ? 'bg-blue-600 text-white ring-2 ring-blue-400' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'}`}
                                        >
                                            2. Detailed Calculation Steps
                                        </button>
                                        <button 
                                            onClick={() => handleOptionSelect(3)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedOptionId === 3 ? 'bg-blue-600 text-white ring-2 ring-blue-400' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'}`}
                                        >
                                            3. Practice Similar Problem
                                        </button>
                                    </div>
                                </div>

                                <p className="whitespace-pre-wrap text-slate-300 text-sm leading-relaxed">{summary}</p>
                            </div>
                        )}
                    </div>

                    <footer className="text-center text-xs text-slate-600 pt-4 border-t border-slate-900">
                        StudyFlow Platform © 2026. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<StudyFlow />, document.getElementById('root'));
    </script>
</body>
